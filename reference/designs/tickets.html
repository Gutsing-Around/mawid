<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موعد الحلقة: تذاكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* Design 2: tickets. Every episode is a cinema ticket; the stub holds the time and countdown. */
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 18px 40px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 26px; }
h1 { font-family: var(--display); font-size: 38px; margin: 0; line-height: 1.1; }
header p { margin: 4px 0 0; color: var(--muted); }

/* Ticket shell: main part + perforated stub */
.ticket { --c: var(--line); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 132px; background: var(--surface);
  border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; }
.ticket .main { padding: 14px; display: flex; gap: 12px; min-width: 0; }
.ticket .stub { position: relative; border-inline-start: 2px dashed var(--line); padding: 12px 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 2px; }
/* Punched notches where the perforation meets the edges */
.ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; right: -10px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line); }
.ticket .stub::before { top: -11px; clip-path: inset(50% 0 0 0); }
.ticket .stub::after { bottom: -10px; clip-path: inset(0 0 50% 0); }
.stub .t { font: 600 22px/1.1 var(--mono); }
.stub .wd { font-size: 12px; color: var(--muted); }
.stub [data-cd] { font: 600 12px/1.4 var(--mono); margin-top: 6px; }
.stub .barcode { margin-top: 8px; width: 80%; height: 18px; opacity: .35;
  background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px); }
.cover { width: 64px; aspect-ratio: 2 / 3; flex: none; border-radius: 6px; object-fit: cover; background: var(--c); }
.info { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.info .row { display: flex; align-items: start; gap: 6px; }
.info h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; flex: 1; }
.info .ro { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; }
.info .meta { font-size: 12.5px; color: var(--muted); }
.info .meta b { color: var(--ink); font-weight: 600; }
.serial { font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: .15em; }
.info .logos { margin-top: auto; padding-top: 4px; }

/* Hero ticket */
.hero { --c: var(--signal); margin-bottom: 30px; grid-template-columns: minmax(0, 1fr) 300px; overflow: hidden; border-top-width: 3px;
  box-shadow: 0 0 0 1px rgb(255 46 62 / .15), 0 20px 50px -20px rgb(255 46 62 / .35); }
.hero .main { position: relative; padding: 24px; gap: 18px; overflow: hidden; border-radius: 10px 0 0 10px; }
.hero .art { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .18; filter: blur(2px); }
.hero .main > :not(.art) { position: relative; }
.hero .cover { width: 104px; box-shadow: 0 10px 30px rgb(0 0 0 / .6); }
.hero h2 { font-family: var(--display); font-size: clamp(22px, 3.4vw, 32px); line-height: 1.2; margin: 4px 0; }
.hero .kicker { font: 600 12px/1 var(--mono); letter-spacing: .2em; }
.hero .stub { gap: 10px; }
.hero .boxes { display: flex; gap: 26px; }
.hero .box { text-align: center; }
.hero .num { display: block; font: 600 34px/1 var(--mono); color: var(--signal); text-shadow: 0 0 12px rgb(255 46 62 / .8); }
.hero .lab { font-size: 11px; color: var(--muted); }

/* Platform filter made of logos */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 22px; }
.filters .label { color: var(--muted); font-size: 13px; margin-inline-end: 4px; }
.filters .logo { cursor: pointer; opacity: .55; }
.filters .logo[aria-pressed="true"] { opacity: 1; border-color: var(--brand); box-shadow: 0 0 12px color-mix(in srgb, var(--brand) 55%, transparent); }
.filters .logo:hover { opacity: 1; }
.filters .all { font: 600 12px/1 var(--body); padding: 0 12px; width: auto; color: var(--ink); --brand: var(--signal); }

.day-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.day-head h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.day-head span { font: 500 12px var(--mono); color: var(--muted); }
.day-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 14px; }

@media (max-width: 640px) {
  .ticket.hero { grid-template-columns: 1fr; }
  .hero .main { border-radius: 10px 10px 0 0; }
  .hero .cover { width: 84px; }
  .hero .stub { border-inline-start: 0; border-top: 2px dashed var(--line); padding: 16px; }
  .hero .stub::before, .hero .stub::after { display: none; }
  .ticket { grid-template-columns: minmax(0, 1fr) 108px; }
  .stub .t { font-size: 18px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>موعد <span class="glow">الحلقة</span></h1>
      <p>تذكرتك لكل حلقة هذا الأسبوع، بتوقيتك.</p>
    </div>
  </header>
  <article class="ticket hero" id="hero"></article>
  <div class="filters" id="filters" role="group" aria-label="تصفية حسب المنصة"></div>
  <div id="days"></div>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
const { items, esc, star, logos, logo, boxes, time, weekday, weekdayTime, dateLabel, dayKey, days, genres, nowSec, count } = Mawid;
let platform = "";

function renderHero() {
  const next = items.find((i) => i.airingAt > nowSec());
  if (!next) return;
  document.getElementById("hero").innerHTML = `
    <div class="main">
      <div class="art" style="background-image:url('${esc(next.banner || next.cover)}')"></div>
      <img class="cover" src="${esc(next.cover)}" alt="غلاف ${esc(next.title)}">
      <div class="info">
        <div class="kicker glow">● تذكرتك القادمة</div>
        <h2>${esc(next.title)}</h2>
        <div class="meta"><b>الحلقة ${next.episode}${next.total ? ` من ${next.total}` : ""}</b> · ${genres(next.genres).join(" · ")}</div>
        ${logos(next.platforms, "lg")}
      </div>
    </div>
    <div class="stub">
      <div class="serial">ADMIT ONE · #${String(next.id).slice(-6)}</div>
      <div class="t">${time(next.airingAt)}</div>
      <div class="wd">${weekday(next.airingAt)} ${dateLabel(next.airingAt)}</div>
      ${boxes(next.airingAt, "boxes")}
    </div>`;
}

function renderFilters() {
  const sites = new Map();
  items.forEach((i) => i.platforms.forEach((p) => sites.has(p.site) || sites.set(p.site, p)));
  // Reuse the logo markup, but as filter toggles instead of links.
  const toggles = [...sites.values()].map((p) => logo(p)
    .replace(/^<a /, `<button type="button" data-site="${esc(p.site)}" aria-pressed="${platform === p.site}" `)
    .replace(/href="[^"]*" target="_blank" rel="noopener noreferrer"/, "")
    .replace(/aria-label="شاهد على/, 'aria-label="تصفية:')
    .replace(/<\/a>$/, "</button>"));
  document.getElementById("filters").innerHTML = `<span class="label">المنصات:</span>
    <button type="button" class="logo word all" data-site="" aria-pressed="${!platform}">الكل</button>${toggles.join("")}`;
}

function ticket(i) {
  return `<article class="ticket" style="--c:${i.color || "#262222"}">
    <div class="main">
      <img class="cover" src="${esc(i.cover)}" alt="غلاف ${esc(i.title)}" loading="lazy">
      <div class="info">
        <div class="row"><h3>${esc(i.title)}</h3>${star(i)}</div>
        ${i.romaji !== i.title ? `<div class="ro">${esc(i.romaji)}</div>` : ""}
        <div class="meta"><b>الحلقة ${i.episode}${i.total ? ` من ${i.total}` : ""}</b> · ${genres(i.genres).slice(0, 3).join(" · ")}</div>
        ${logos(i.platforms)}
      </div>
    </div>
    <div class="stub">
      <div class="t">${time(i.airingAt)}</div>
      <div class="wd">${weekday(i.airingAt)}</div>
      <div data-cd="${i.airingAt}"></div>
      <div class="barcode" aria-hidden="true"></div>
    </div>
  </article>`;
}

function renderDays() {
  const list = items.filter((i) => !platform || i.platforms.some((p) => p.site === platform));
  document.getElementById("days").innerHTML = days().map((d) => {
    const day = list.filter((i) => dayKey(i.airingAt) === d.key);
    if (!day.length) return "";
    return `<section><div class="day-head"><h2>${d.label}</h2><span>${d.date} · ${count(day.length, "ep")}</span></div>
      <div class="list">${day.map(ticket).join("")}</div></section>`;
  }).join("") || `<p class="muted">لا توجد حلقات على هذه المنصة.</p>`;
  Mawid.tick();
}

document.getElementById("filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-site]"); if (!b) return;
  platform = b.dataset.site === platform ? "" : b.dataset.site;
  renderFilters(); renderDays();
});

renderHero(); renderFilters(); renderDays(); Mawid.nav("tickets.html");
</script>
</body>
</html>
