:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;letter-spacing:0}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--soon-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.notice b{color:var(--soon)}
.next{background:var(--ink);color:var(--bg);border-radius:18px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.next .lab{font-size:12.5px;letter-spacing:.04em;opacity:.75}
.next h2{font-family:var(--display);font-size:26px;margin:4px 0 2px;text-wrap:balance}
.next .sub{opacity:.8;font-size:14px}
.big{display:flex;gap:10px;direction:rtl}
.big div{display:flex;flex-direction:column;align-items:center;min-width:62px;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:10px;padding:8px 6px}
.big b{font-family:var(--display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:11.5px;opacity:.75}
@media (max-width:640px){.next{grid-template-columns:1fr}.big div{min-width:0;flex:1}.big b{font-size:28px}}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.days button small{font-size:11.5px;color:var(--muted)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.75}
.days .count{font-size:11px;background:var(--chip);color:var(--ink);border-radius:999px;padding:0 7px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:84px 1fr;overflow:hidden;min-width:0}
.card{grid-template-columns:96px 1fr}
.cover{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:#fff;min-height:100%;position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:0 8px}
.tag.adult{color:var(--soon);border-color:color-mix(in srgb,var(--soon) 45%,transparent)}
.desc{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink)}
.info{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.info h3{font-family:var(--display);font-size:17px;font-weight:500;margin:0;line-height:1.35;text-wrap:balance}
.romaji{font-size:12.5px;color:var(--muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
.star{border:none;background:none;padding:2px 4px;font-size:20px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--soon);background:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.cd{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.cd.soon{color:var(--soon)}
.cd.live{color:var(--accent)}
.bar{height:4px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.plat{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--ink);text-decoration:none;border:1px solid transparent}
.plat.local{border-color:var(--accent)}
.plat.local::after{content:" ✓";color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    [["Drama","Psychological"],"طالبة جامعية تدخل عالم تداول العملات لتستعيد المال الذي خسرته والدتها الراحلة."],
    [["Action","Adventure","Fantasy","Mecha"],"ثلاث طالبات في رحلة مدرسية يُستدعين إلى عالم آخر لحماية أميرته."],
    [["Adventure","Survival","Supernatural"],"فتاة تغادر قريتها في أرض اجتاحها الزومبي بحثًا عن والدها المفقود."],
    [["Action","Adventure","Fantasy"],"صديقا طفولة من فرقة عسكرية شبابية يُجرّان إلى الحرب وينالان قوة هائلة."],
    [["Action","Fantasy","Suspense"],"فتيات سحريات مختارات يُجبَرن على منافسة قاتلة لأن عددهن يجب أن ينخفض إلى النصف."],
  ];
  const DESC_BY_RO={}; SEASON.forEach((s,i)=>{DESC_BY_RO[s[0].toLowerCase()]=META[i][1]});
  const PALETTE=["#4A5BD4","#B0476A","#2F7D6B","#C07A1E","#A13D2D","#3D6FA8","#6A4FA0","#2C8CA3","#7C6A2E","#9B4B92","#33507A","#8A5A3B"];
  // Next episode = premiere + one week per episode (does not know about breaks or delays).
  function buildSeason(){
    const t=Math.floor(Date.now()/1000), WEEK=7*86400, out=[];
    SEASON.forEach(([ro,en,total,iso,svc],i)=>{
      const p=Math.floor(Date.parse(iso)/1000);
      let n = t<=p ? 0 : Math.ceil((t-p)/WEEK);
      const ep=n+1;
      if(total && ep>total) return;
      out.push({id:i,titleAr:en||ro,titleRo:ro,episode:ep,total,airingAt:p+n*WEEK,color:PALETTE[i%PALETTE.length],
        genres:META[i][0],desc:META[i][1],cover:null,
        links:svc.map(site=>({site,local:false}))});
    });
    return out;
  }
  const SAMPLE = buildSeason();

  const QUERY = `query($from:Int,$to:Int,$page:Int){Page(page:$page,perPage:50){pageInfo{hasNextPage}
    airingSchedules(airingAt_greater:$from,airingAt_lesser:$to,sort:TIME){episode airingAt
      media{id isAdult episodes genres siteUrl title{romaji english native} coverImage{large color}
        externalLinks{site url type}}}}}`;

  async function loadLive(){
    const from = now0 - 600, to = now0 + 7*24*HOUR, out=[];
    for(let page=1; page<=4; page++){
      const r = await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({query:QUERY,variables:{from,to,page}})});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const j = await r.json(), p = j.data.Page;
      p.airingSchedules.forEach(a=>{ const m=a.media; if(!m||m.isAdult) return;
        out.push({id:m.id+"-"+a.episode,titleAr:m.title.english||m.title.romaji,titleRo:m.title.romaji,episode:a.episode,total:m.episodes,
          airingAt:a.airingAt,color:m.coverImage&&m.coverImage.color||"#4A5BD4",
          cover:m.coverImage&&m.coverImage.large||null,genres:m.genres||[],
          desc:DESC_BY_RO[(m.title.romaji||"").toLowerCase()]||"",
          links:(m.externalLinks||[]).filter(l=>l.type==="STREAMING").map(l=>({site:l.site,url:l.url,local:false}))});
      });
      if(!p.pageInfo.hasNextPage) break;
    }
    return out;
  }

  // ---- state ----
  const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
                 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  let items = SAMPLE, favs = new Set(store.get("mawid.favs",[])), arDigits = store.get("mawid.digits",false);
  let onlyFav=false, platFilter="", genreFilter="", selDay=null;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const loc = () => arDigits ? "ar-SA" : "ar-SA-u-nu-latn";
  const num = n => new Intl.NumberFormat(loc()).format(n);
  const pad = n => arDigits ? new Intl.NumberFormat(loc(),{minimumIntegerDigits:2}).format(n) : String(n).padStart(2,"0");
  const dayKey = t => new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(t*1000);
  const timeStr = t => new Intl.DateTimeFormat(loc(),{timeZone:tz,hour:"numeric",minute:"2-digit"}).format(t*1000);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function parts(sec){sec=Math.max(0,sec);return{d:Math.floor(sec/86400),h:Math.floor(sec%86400/3600),m:Math.floor(sec%3600/60),s:sec%60}}
  function short(sec){
    if(sec<=0) return "تُعرض الآن";
    const p=parts(sec);
    if(p.d>0) return `بعد ${num(p.d)} يوم و${num(p.h)} ساعة`;
    if(p.h>0) return `بعد ${num(p.h)} ساعة و${num(p.m)} دقيقة`;
    return `بعد ${pad(p.m)}:${pad(p.s)}`;
  }

  function visible(){
    return items.filter(x=>(!onlyFav||favs.has(String(x.titleRo)))&&(!platFilter||x.links.some(l=>l.site===platFilter))&&(!genreFilter||(x.genres||[]).includes(genreFilter)));
  }

  function renderDays(){
    const nav=document.getElementById("days"); nav.textContent="";
    const vis=visible();
    for(let i=0;i<7;i++){
      const t=now0+i*86400, k=dayKey(t), c=vis.filter(x=>dayKey(x.airingAt)===k).length;
      const b=document.createElement("button");
      b.setAttribute("aria-pressed",String(k===selDay));
      const name = i===0?"اليوم":i===1?"غدًا":new Intl.DateTimeFormat("ar",{timeZone:tz,weekday:"long"}).format(t*1000);
      b.innerHTML=`<span>${name}</span><small>${new Intl.DateTimeFormat(loc(),{timeZone:tz,day:"numeric",month:"short"}).format(t*1000)}</small><span class="count">${num(c)}</span>`;
      b.onclick=()=>{selDay=k;renderDays();renderGrid()};
      nav.appendChild(b);
    }
  }

  function card(x){
    const fav=favs.has(String(x.titleRo));
    const prog = x.total? Math.min(100,Math.round((x.episode-1)/x.total*100)) : null;
    const plats = x.links.map(l=>{
      const cls="plat"+(l.local?" local":"");
      return l.url?`<a class="${cls}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.site)}</a>`:`<span class="${cls}">${esc(l.site)}</span>`;
    }).join("") || `<span class="plat">لا توجد منصة رسمية بعد</span>`;
    const initial = esc([...String(x.titleAr).trim()][0]||"؟");
    const cover = x.cover
      ? `<div class="cover" style="background:${esc(x.color)}"><img src="${esc(x.cover)}" alt="غلاف ${esc(x.titleAr)}" loading="lazy"></div>`
      : `<div class="cover" style="background:${esc(x.color)}" aria-hidden="true">${initial}</div>`;
    const tags = (x.genres||[]).map(g=>`<span class="tag${g==="Ecchi"?" adult":""}">${esc(GENRE_AR[g]||g)}</span>`).join("");
    return `<article class="card">
      ${cover}
      <div class="info">
        <div class="top"><h3>${esc(x.titleAr)}</h3>
          <button class="star" data-k="${esc(x.titleRo)}" aria-pressed="${fav}" aria-label="أضف إلى قائمتي">★</button></div>
        ${x.titleRo!==x.titleAr?`<div class="romaji">${esc(x.titleRo)}</div>`:""}
        <div class="meta"><span>الحلقة ${num(x.episode)}${x.total?" من "+num(x.total):""}</span><span>${timeStr(x.airingAt)}</span>
          <span class="cd" data-t="${x.airingAt}"></span></div>
        ${tags?`<div class="tags">${tags}</div>`:""}
        ${x.desc?`<p class="desc">${esc(x.desc)}</p>`:""}
        ${prog!==null?`<div class="bar" title="تقدّم الموسم"><i style="width:${prog}%"></i></div>`:""}
        <div class="plats">${plats}</div>
      </div></article>`;
  }

  function renderGrid(){
    const g=document.getElementById("grid");
    const list=visible().filter(x=>dayKey(x.airingAt)===selDay).sort((a,b)=>a.airingAt-b.airingAt);
    g.innerHTML = list.length? list.map(card).join("") : `<p class="empty">${onlyFav?"لا توجد حلقات من قائمتك في هذا اليوم.":"لا توجد حلقات في هذا اليوم."}</p>`;
    g.querySelectorAll(".star").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
      favs.has(k)?favs.delete(k):favs.add(k); store.set("mawid.favs",[...favs]); renderDays(); renderGrid(); renderNext();});
    tick();
  }

  let nextItem=null;
  function renderNext(){
    const t=Date.now()/1000;
    nextItem = visible().filter(x=>x.airingAt>t).sort((a,b)=>a.airingAt-b.airingAt)[0];
    const el=document.getElementById("next");
    if(!nextItem){el.innerHTML=`<div><div class="lab">الحلقة القادمة</div><h2>لا توجد حلقات قادمة ضمن هذا الاختيار</h2></div>`;return}
    el.innerHTML=`<div><div class="lab">الحلقة القادمة</div><h2>${esc(nextItem.titleAr)}</h2>
      <div class="sub">الحلقة ${num(nextItem.episode)} · ${new Intl.DateTimeFormat(loc(),{timeZone:tz,weekday:"long",hour:"numeric",minute:"2-digit"}).format(nextItem.airingAt*1000)}</div></div>
      <div class="big" id="big"></div>`;
    tick();
  }

  function tick(){
    const t=Math.floor(Date.now()/1000);
    document.querySelectorAll(".cd").forEach(e=>{const d=+e.dataset.t-t;
      e.textContent=short(d); e.className="cd"+(d<=0?" live":d<3600?" soon":"");});
    const big=document.getElementById("big");
    if(big&&nextItem){
      if(nextItem.airingAt<=t){renderNext();return}
      const p=parts(nextItem.airingAt-t);
      big.innerHTML=[["d","يوم"],["h","ساعة"],["m","دقيقة"],["s","ثانية"]].map(([k,l])=>`<div><b>${pad(p[k])}</b><small>${l}</small></div>`).join("");
    }
  }

  function renderPlatforms(){
    const s=document.getElementById("plat"), cur=s.value;
    const sites=[...new Set(items.flatMap(x=>x.links.map(l=>l.site)))].sort();
    s.innerHTML=`<option value="">كل المنصات</option>`+sites.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
    const g=document.getElementById("genre"), gc=g.value;
    const gs=[...new Set(items.flatMap(x=>x.genres||[]))].sort((a,b)=>(GENRE_AR[a]||a).localeCompare(GENRE_AR[b]||b,"ar"));
    g.innerHTML=`<option value="">كل التصنيفات</option>`+gs.map(x=>`<option value="${esc(x)}"${x===gc?" selected":""}>${esc(GENRE_AR[x]||x)}</option>`).join("");
  }

  function renderAll(){
    document.getElementById("digits").setAttribute("aria-pressed",String(arDigits));
    document.getElementById("tzline").textContent="الأوقات معروضة حسب منطقتك الزمنية: "+tz;
    renderPlatforms(); renderDays(); renderGrid(); renderNext();
  }

  document.getElementById("plat").onchange=e=>{platFilter=e.target.value;renderAll()};
  document.getElementById("genre").onchange=e=>{genreFilter=e.target.value;renderAll()};
  document.getElementById("fav").onclick=e=>{onlyFav=!onlyFav;e.currentTarget.setAttribute("aria-pressed",String(onlyFav));renderAll()};
  document.getElementById("digits").onclick=()=>{arDigits=!arDigits;store.set("mawid.digits",arDigits);renderAll()};

  selDay=dayKey(now0);
  const notice=document.getElementById("notice");
  notice.hidden=false;
  const snapMsg="<b>جدول خريف ٢٠٢٦ الحقيقي</b> (لقطة بتاريخ ١٤ أكتوبر). موعد الحلقة القادمة محسوب أسبوعيًا من موعد العرض الأول، لذلك لا يظهر التأجيل أو التوقف.";
  notice.innerHTML=snapMsg+" جاري محاولة جلب الجدول المباشر من AniList…";
  renderAll();
  setInterval(tick,1000);

  loadLive().then(data=>{
    if(!data.length) throw new Error("empty");
    items=data; notice.hidden=true; renderAll();
  }).catch(()=>{ notice.innerHTML=snapMsg; });
})();
</script>
